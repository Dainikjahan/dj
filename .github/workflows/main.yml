name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${ {cfat_Dtg5Ew9MiUfJfu3nxRY0F4XSY3SyJ6K17AJDZyYGd0f0e84b}}
          accountId: ${ {4cfa321c5d0f183bff84773f58764d04}}
          command: pages deploy dist --project-name=YOUR_PROJECT_NAME
