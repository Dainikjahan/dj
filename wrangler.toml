name = "dj-staging"
main = "src/ingestion.js"
compatibility_date = "2026-11-16"

[[d1_databases]]
binding = "DB"
database_name = "dj-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "dj-ingest-staging"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENV = "staging"
SITE_URL = "https://ukaiacademy.org"

[env.staging]
name = "dj-staging"
routes = [
  { pattern = "ukaiacademy.org", custom_domain = true },
  { pattern = "www.ukaiacademy.org", custom_domain = true }
]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "dj-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"

[[env.staging.queues.producers]]
binding = "INGEST_QUEUE"
queue = "dj-ingest-staging"

[env.staging.triggers]
crons = ["*/5 * * * *"]

[env.staging.vars]
ENV = "staging"
SITE_URL = "https://ukaiacademy.org"
