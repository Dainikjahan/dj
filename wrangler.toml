# Dainik Jahan — Phase 1 Staging ONLY. Do NOT point at production until owner Level-2 approval.
name = "dainik-jahan-phase1"
main = "src/ingestion.js"
compatibility_date = "2026-11-16"

[[d1_databases]]
binding = "DB"
database_name = "dainik-jahan-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "dj-ingest-staging"

# Cron: every 5 minutes for ingestion. NOT per-second — free tier cannot do per-second polling.
[triggers]
crons = ["*/5 * * * *"]

[vars]
ENV = "staging"
SITE_URL = "https://staging.dainikjahan.com"
# Secrets NEVER here: DJ_TELEGRAM_BOT_TOKEN, WP_APP_USER, WP_APP_PASSWORD go in wrangler secret put
